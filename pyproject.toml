[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ontfs"
version = "0.1.0"
description = "Ontology Knowledge Graph CLI tool for files and URLs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rdflib>=7.0.0",
]

[project.scripts]
ontfs = "ontfs.cli:main"
